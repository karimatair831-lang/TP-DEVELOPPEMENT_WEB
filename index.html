```html
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription formation</title>

    <!-- Liaison avec le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Formulaire d'inscription à une formation</h1>

    <form method="post" enctype="multipart/form-data">

        <!-- Conteneur des trois groupes -->
        <div class="groupes">

            <!-- Partie A : Informations personnelles -->
            <fieldset>
                <legend>A - Informations personnelles</legend>

                <label for="nom">Nom * :</label>
                <input type="text" id="nom" name="nom"
                       placeholder="Ex: Benali" required>

                <label for="prenom">Prénom * :</label>
                <input type="text" id="prenom" name="prenom"
                       placeholder="Ex: Ahmed" required>

                <label for="email">Adresse e-mail * :</label>
                <input type="email" id="email" name="email"
                       placeholder="exemple@email.com" required>

                <label for="mdp">Mot de passe * :</label>
                <input type="password" id="mdp" name="mdp" required>

                <label for="naissance">Date de naissance :</label>
                <input type="date" id="naissance" name="naissance">

                <label for="tel">Téléphone :</label>
                <input type="tel" id="tel" name="tel"
                       placeholder="0600000000">

                <label for="age">Âge :</label>
                <input type="number" id="age" name="age"
                       min="18" max="60" placeholder="18-60">

                <!-- Choix du sexe -->
                <p class="sous-titre">Sexe :</p>

                <div class="choix">

                    <div>
                        <input type="radio" id="homme"
                               name="sexe" value="Homme">
                        <label for="homme">Homme</label>
                    </div>

                    <div>
                        <input type="radio" id="femme"
                               name="sexe" value="Femme">
                        <label for="femme">Femme</label>
                    </div>

                </div>

            </fieldset>


            <!-- Partie B : Formation -->
            <fieldset>
                <legend>B - Formation</legend>

                <label for="niveau">Niveau d'étude :</label>

                <select id="niveau" name="niveau">
                    <option value="">-- Choisissez votre niveau --</option>
                    <option value="1re">1re année</option>
                    <option value="2e">2e année</option>
                    <option value="3e">3e année</option>
                </select>

                <label for="filiere">Filière * :</label>

                <select id="filiere" name="filiere" required>
                    <option value="">-- Choisissez une filière --</option>
                    <option value="gi">Génie informatique</option>
                    <option value="rt">Réseaux et télécommunication</option>
                    <option value="ia">IA</option>
                    <option value="cs">Cyber Security</option>
                    <option value="bd">Big Data</option>
                </select>

            </fieldset>


            <!-- Partie C : Compétences -->
            <fieldset>
                <legend>C - Compétences</legend>

                <!-- Technologies maîtrisées -->
                <p class="sous-titre">Technologies maîtrisées :</p>

                <div class="choix-colonne">

                    <div>
                        <input type="checkbox" id="html"
                               name="tech" value="HTML">
                        <label for="html">HTML</label>
                    </div>

                    <div>
                        <input type="checkbox" id="css"
                               name="tech" value="CSS">
                        <label for="css">CSS</label>
                    </div>

                    <div>
                        <input type="checkbox" id="js"
                               name="tech" value="JS">
                        <label for="js">JavaScript</label>
                    </div>

                    <div>
                        <input type="checkbox" id="python"
                               name="tech" value="Python">
                        <label for="python">Python</label>
                    </div>

                </div>


                <!-- Domaines d'intérêt -->
                <p class="sous-titre">Domaines d'intérêt :</p>

                <div class="choix-colonne">

                    <div>
                        <input type="checkbox" id="web"
                               name="interet" value="Web">
                        <label for="web">Développement Web</label>
                    </div>

                    <div>
                        <input type="checkbox" id="reseaux"
                               name="interet" value="Reseaux">
                        <label for="reseaux">Réseaux</label>
                    </div>

                    <div>
                        <input type="checkbox" id="cyber"
                               name="interet" value="Cyber">
                        <label for="cyber">Cyber Security</label>
                    </div>

                    <div>
                        <input type="checkbox" id="ai"
                               name="interet" value="AI">
                        <label for="ai">Intelligence artificielle</label>
                    </div>

                </div>

                <!-- Zone de motivation -->
                <label for="motivation">Motivation :</label>

                <textarea id="motivation" name="motivation"
                          rows="5" cols="40"
                          placeholder="Expliquez votre motivation..."></textarea>

                <!-- Téléchargement du CV -->
                <label for="cv">Télécharger CV :</label>
                <input type="file" id="cv" name="cv">

            </fieldset>

        </div>

        <!-- Boutons du formulaire -->
        <div class="boutons">

            <!-- Bouton vert -->
            <button type="submit">S'inscrire</button>

            <!-- Bouton rouge -->
            <button type="reset">Réinitialiser</button>

        </div>

    </form>

</body>
</html>
```
