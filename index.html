<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices JavaScript</title>

     <script src="script.js" defer ></script>

</head>
<body>
    <h1>Exercice 1</h1>
    <button onclick="demarrer()" >Commencer </button>

     <h2>Outils de calcul de Exercice 2</h2>
     <label for="nombre" >Donner un entier :</label>
     <input type="number" name="nombre" id="nombre">

     <button onclick="calculerSomme()">Calculer la Somme : </button>
     <button onclick="afficherPairs()">Afficher les nombres pairs :</button>

     <p id="resultats"></p>



      <h2>Exercice 3 : Manipulation du DOM</h2>

    <section id="cours">

        <h2 id="titreCours">Découvrir JavaScript</h2>

        <p class="chapitre">Les variables</p>

        <p class="chapitre important">Les fonctions</p>

        <p class="chapitre">Les événements</p>

        <button type="button" id="modifier">
            Modifier la présentation
        </button>

    </section>


        <!--EXERCICE 4-->
         <h2>Exercice 4 : Zone interactive</h2>

    <section>

        <label for="prenom">Prénom :</label>

        <input type="text" id="prenom"
            onfocus="mettreEnEvidence(this)"
            onblur="retablirStyle(this)"
            oninput="afficherSaisie(this)">

        <p id="apercu"></p>

        <button type="button" id="selectionner">
            Sélectionner le texte
        </button>

        <p id="survol"
            onmouseover="changerCouleur(this)"
            onmouseout="retablirCouleur(this)">
            Survolez ce texte.
        </p>

    </section>


     <!-- ===================== -->
    <!-- EXERCICE 5 -->
    <!-- ===================== -->

    <h2>Exercice 5 : Formulaire d'inscription</h2>

    <form id="formInscription" name="inscription">

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom">

        <br><br>

        <label for="profession">Profession :</label>

        <select id="profession" name="profession">
            <option value="">Choisir une profession</option>
            <option value="Technicien">Technicien</option>
            <option value="Ingénieur">Ingénieur</option>
            <option value="Médecin">Médecin</option>
        </select>

        <br><br>

        <label>Sexe :</label>

        <input type="radio" name="sexe" value="H"> H

        <input type="radio" name="sexe" value="F"> F

        <br><br>

        <label>Langues :</label>

        <input type="checkbox" name="langue" value="Arabe">
        Arabe

        <input type="checkbox" name="langue" value="Français">
        Français

        <br><br>

        <button type="submit">Inscrire</button>

        <button type="reset">Effacer</button>

    </form>

    <p id="message"></p>

    <h3>Récapitulatif :</h3>

    <pre id="recap"></pre>


</body>
</html>
